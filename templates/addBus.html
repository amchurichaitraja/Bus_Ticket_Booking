{% include 'adminNavbar1.html' %}

  <div class="container">
    <div class="row">
      <div class="col-md-4"></div>
      <div class="col-md-4">
        <div class="text-center h5 mt-3" style="color:purple">Add Bus</div>
        <div class="card2 mt-3 p-3">
          <form action="addBuses1" method="post">
            <input type="hidden" name="providers_id" value="{{providers_id}}">
           
            <div class="mt-3">
              <label for="no_of_ticket" class="form-label">Driver Name</label>
              <input  type="text" name="driver" id="driver" placeholder="Enter Name" class="form-control">
            </div>
            <div class="mt-3">
              <label for="no_of_ticket" class="form-label">No of Tickets</label>
              <input  type="number" name="no_of_ticket" id="no_of_ticket" placeholder="Enter no of Tickets" class="form-control">
            </div>
            <div class="mt-3">
              <label for="departure_date" class="form-label">Departure Date</label>
              <input type="datetime-local" name="departure_date" id="departure_date" placeholder="Enter Departure Date" class="form-control">
            </div>
            <div class="mt-3">
              <label for="arrival_date" class="form-label">Arrival Date</label>
              <input type="datetime-local" name="arrival_date" id="arrival_date" placeholder="Enter Arrival Date" class="form-control">
            </div>
            <div class="mt-3">
              <label for="source" class="form-label">source</label>
              <select type="text" name="source" id="source" placeholder="Enter Source" required class="form-control">
                <option value="Lenexa">Lenexa</option>
                <option value="Kansas">Kansas</option>
                <option value="Overland">Overland</option>
                <option value="Leawood">Leawood</option>
                <option value="Kearney">Kearney</option>
              </select>
            </div>
            <div class="mt-3">
              <label for="destination" class="form-label">destination</label>
             <select type="text" name="destination" id="destination" placeholder="Enter destination" required class="form-control">
                <option value="Lenexa">Lenexa</option>
                <option value="Kansas">Kansas</option>
                <option value="Overland">Overland</option>
                <option value="Leawood">Leawood</option>
                <option value="Kearney">Kearney</option>
              </select>
            </div>
            <div class="mt-3">
              <label for="price_per_ticket" class="form-label">Price Per Ticket</label>
              <input type="number" name="price_per_ticket" id="price_per_ticket" placeholder="Enter Ticket Price" class="form-control">
            </div>
            <div class="mt-2">
              <input type="submit" value="Add Bus" class="btn btn-success w-100">
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
